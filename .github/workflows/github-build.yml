name: Build PixelPlayer iOS & Web

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  web-and-capacitor-sync:
    name: Prepare Web & Capacitor Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Sync Web Assets
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json

      - name: Upload Web PWA Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixelplayer-web-pwa
          path: www/

  build-ios-ipa:
    name: Build Unsigned iOS IPA (AltStore / SideStore / Sideloadly)
    needs: web-and-capacitor-sync
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Add iOS Platform
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS Info.plist for Audio & Background Playback
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || true

      - name: Build Unsigned .xcarchive via Xcode
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/PixelPlayer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package Unsigned .IPA
        run: |
          mkdir -p build/Payload
          cp -r build/PixelPlayer.xcarchive/Products/Applications/App.app build/Payload/PixelPlayer.app
          cd build && zip -r PixelPlayer-unsigned.ipa Payload

      - name: Upload iOS .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelPlayer-iOS-IPA
          path: build/PixelPlayer-unsigned.ipa
